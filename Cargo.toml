[package]
name = "tc-value"
version = "0.14.0"
edition = "2021"

[dependencies]
async-hash = { path = "../deps/async-hash", version = "0.6" }
bytes = "1"
collate = { path = "../deps/collate" }
destream = { path = "../deps/destream", version = "0.10" }
get-size = "0.1"
futures = "0.3"
hr-id = { path = "../deps/hr-id", version = "0.7" }
number-general = { path = "../deps/number-general", version = "0.14", default-features = false, features = ["hash", "stream"] }
pathlink = { path = "../deps/pathlink", default-features = false, features = ["hash"] }
safecast = "0.2"
[dev-dependencies]
destream_json = { path = "../deps/destream_json", version = "0.15", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tbon = { path = "../deps/tbon", version = "0.9" }
